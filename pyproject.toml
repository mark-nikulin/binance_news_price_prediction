[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-news-price-prediction"
version = "0.1.0"
description = "LFT/MFT trend prediction from crypto news (Binance announcements) validated via backtest_strat"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "catboost>=1.2",
]

[project.optional-dependencies]
nlp = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
np-cli = "news_pred.cli:main"

[tool.setuptools.packages.find]
include = ["news_pred*"]
exclude = ["tests*", "data*", "agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

